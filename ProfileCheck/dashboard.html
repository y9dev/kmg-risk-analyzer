<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Identity Risk Analyzer</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #e8eef7; background: #101827; }
    body { max-width: 1180px; margin: 0 auto; padding: 32px 20px 60px; }
    h1 { font-size: 2rem; margin: 0 0 6px; } h2 { font-size: 1.25rem; margin: 30px 0 14px; }
    p { color: #aab8ca; } .top { display: flex; justify-content: space-between; gap: 20px; align-items: center; flex-wrap: wrap; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    button, select, a.export { border: 1px solid #415576; border-radius: 9px; padding: 10px 14px; background: #18263b; color: #e8eef7; font: inherit; }
    button { background: #3387f2; border-color: #3387f2; color: #fff; cursor: pointer; font-weight: 650; }
    button:disabled { opacity: .55; cursor: progress; } a.export { text-decoration: none; } a.export[hidden] { display: none; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 24px; }
    .card { background: #19263a; border: 1px solid #2a3b53; padding: 18px; border-radius: 12px; }
    .card strong { display: block; font-size: 1.9rem; margin-top: 6px; } .card span { color: #aab8ca; }
    .tablewrap { overflow-x: auto; border: 1px solid #2a3b53; border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; min-width: 780px; }
    th, td { text-align: left; padding: 13px 14px; vertical-align: top; border-bottom: 1px solid #2a3b53; }
    th { background: #19263a; color: #aab8ca; font-size: .85rem; } tr:last-child td { border-bottom: 0; }
    .badge { display: inline-block; padding: 3px 9px; border-radius: 8px; font-weight: 650; }
    .Critical { background: #6b2634; color: #ffcbd0; } .High { background: #663c25; color: #ffe2bb; }
    .Medium { background: #615423; color: #fff1ae; } .Low { background: #244766; color: #c2e5ff; }
    #status { min-height: 24px; } .muted { font-size: .9rem; } td { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <header class="top">
    <div><h1>Identity Risk Analyzer</h1><p>Проверка учётных записей и привилегий Active Directory</p></div>
    <div class="actions">
      <select id="source" aria-label="Источник данных"><option value="demo">Демо данные</option><option value="ldap">Тестовый AD (LDAPS)</option></select>
      <button id="scan">Запустить анализ</button>
      <a class="export" id="export" href="/api/v1/export.csv" hidden>Скачать CSV</a>
    </div>
  </header>
  <p id="status" role="status">Загрузка...</p>
  <div class="grid" id="stats"></div>
  <h2>Найденные риски</h2>
  <div class="tablewrap"><table><thead><tr><th>Уровень</th><th>Объект</th><th>Причина</th><th>Что сделать</th></tr></thead><tbody id="findings"><tr><td colspan="4">Запусти анализ, чтобы увидеть результат.</td></tr></tbody></table></div>
  <p class="muted" id="meta"></p>
  <script>
    const $ = id => document.getElementById(id);
    const labels = [['security_score','AD Security Score'],['Critical','Critical'],['High','High'],['Medium','Medium'],['Low','Low'],['accounts','Всего аккаунтов'],['privileged_accounts','Привилегированных']];
    async function load() {
      const response = await fetch('/api/v1/report');
      if (response.status === 404) { $('status').textContent = 'Пока нет результатов. Нажми «Запустить анализ».'; return; }
      if (!response.ok) throw new Error('Не удалось загрузить отчёт');
      const report = await response.json();
      $('status').textContent = 'Анализ завершён';
      $('export').hidden = false;
      $('stats').replaceChildren();
      const values = {security_score: report.security_score ?? '—', ...report.counts, accounts: report.inventory.users + report.inventory.service_accounts, privileged_accounts: report.inventory.privileged_accounts};
      for (const [key, label] of labels) {
        const card = document.createElement('div'); card.className = 'card';
        const title = document.createElement('span'); title.textContent = label;
        const value = document.createElement('strong'); value.textContent = values[key];
        card.append(title, value); $('stats').append(card);
      }
      $('findings').replaceChildren();
      if (!report.findings.length) {
        const row = $('findings').insertRow(); const cell = row.insertCell(); cell.colSpan = 4; cell.textContent = 'Рисков не обнаружено.';
      }
      for (const finding of report.findings) {
        const row = $('findings').insertRow();
        const badge = document.createElement('span'); badge.className = 'badge ' + finding.severity; badge.textContent = finding.severity;
        row.insertCell().append(badge);
        row.insertCell().textContent = finding.object_name;
        row.insertCell().textContent = finding.description;
        row.insertCell().textContent = finding.recommendation;
      }
      $('meta').textContent = `Источник: ${report.source} · Обновлено: ${new Date(report.generated_at).toLocaleString('ru-RU')} · Находки: ${report.findings.length}`;
    }
    $('scan').addEventListener('click', async () => {
      $('scan').disabled = true; $('status').textContent = 'Проверка выполняется...';
      try {
        const response = await fetch('/api/v1/scans', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({source:$('source').value})});
        if (!response.ok) { const result = await response.json(); throw new Error(result.error || 'Ошибка анализа'); }
        await load();
      } catch (error) { $('status').textContent = error.message; }
      finally { $('scan').disabled = false; }
    });
    load().catch(error => { $('status').textContent = error.message; });
  </script>
</body>
</html>
